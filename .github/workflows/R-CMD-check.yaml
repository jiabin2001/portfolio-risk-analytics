name: R package quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Audit committed output artifacts
        run: Rscript --vanilla scripts/audit_outputs.R
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libglpk-dev pandoc
      - uses: r-lib/actions/setup-renv@v2
      - name: Install CI tooling
        shell: Rscript {0}
        run: install.packages(c("rcmdcheck", "lintr"))
      - name: Unit tests
        run: Rscript scripts/run_tests.R
      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
      - name: Lint
        shell: Rscript {0}
        run: |
          if (requireNamespace("lintr", quietly = TRUE)) lintr::lint_package()
