profile: full
data:
  source: yahoo
  tickers: ['^FTSE', '^GSPC']
  start: '2000-01-01'
  end: '2025-12-31'
  frequency: weekly
  adjusted: true
  cache: true
  force_refresh: false
  min_observations: 1000
portfolio:
  weights: [0.5, 0.5]
  return_type: log
  currency_mode: local_index_return
  asset_currencies: [GBP, USD]
  base_currency: GBP
  allow_short: false
risk:
  confidence_levels: [0.95, 0.99]
models:
  arma_p: [0, 1, 2, 3]
  arma_q: [0, 1, 2]
  garch_orders: [[1, 1], [1, 2], [2, 1]]
  volatility_families: [sGARCH, eGARCH, gjrGARCH]
  distributions: [norm, std, sstd, ged, sged]
  information_criterion: BIC
  diagnostic_alpha: 0.01
  solver: hybrid
  timeout_seconds: 120
  reselection_frequency: 65
  copula_families: [gaussian, student, clayton, gumbel, frank, bb1]
simulation:
  final_n: 100000
  rolling_n: 10000
  # Fixed values are reproducible; changing chunk_size can change exact Monte Carlo draws.
  chunk_size: 10000
  seed: 20260718
  keep_asset_returns: false
  convergence_counts: [1000, 2000, 5000, 10000, 20000, 50000, 100000]
  convergence_seeds: [104729, 130363, 155921, 196613, 232003]
rolling:
  window_type: moving
  initial_window: 520
  window_size: 520
  evaluation_observations: 260
  models: [historical, gaussian, student_t, ewma, filtered_historical, copula_garch]
  checkpoint: true
compute:
  resume: true
report:
  render: true
